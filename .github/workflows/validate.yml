name: Validate
run-name: validate

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validation-runner
  cancel-in-progress: false

jobs:
  validate:
    name: validate-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Windows only. There is no Linux sandbox build to validate: every
      # platform-scoped sandbox entry in GameClient's config/frameworks.yml sits
      # under a `platforms.windows` block (no profile has one under
      # `platforms.linux`), and pipeline.yml's push-main Sandbox Build job
      # hardcodes `platform: 'windows'`.
      #
      # A linux lane therefore matched no build on any run it ever made, and
      # reported a green that validated nothing: `allow_missing_build: true` made
      # "no build exists for this target" indistinguishable from "this build
      # passed". That is the failure this workflow exists to catch, so it must not
      # model it. Re-add a linux entry here only once CI actually produces a Linux
      # sandbox artifact (and then with allow_missing_build: false, so an absent
      # artifact is a failure rather than a silent pass).
      matrix:
        include:
          - target: windows
            os: windows-latest
            allow_missing_build: false
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PLATFORM_BASE_URL: ${{ vars.PLATFORM_BASE_URL || secrets.PLATFORM_BASE_URL }}
      PLATFORM_AUTH_TOKEN: ${{ secrets.PLATFORM_AUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Enable Windows long paths for Git
        if: matrix.target == 'windows'
        shell: powershell
        run: git config --global core.longpaths true

      - name: Checkout GameClient config and tests
        uses: actions/checkout@v4
        with:
          repository: frostebite/GameClient
          path: GameClient
          token: ${{ secrets.GAMECLIENT_REPO_TOKEN || github.token }}
          fetch-depth: 1
          lfs: false
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore runner
        run: dotnet restore ValidationRunner.sln --nologo --verbosity quiet

      - name: Run validation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAMECLIENT_CONFIG_ROOT: ${{ github.workspace }}/GameClient
        run: >
          dotnet run --project src/ValidationRunner --
          --gameclient "$GAMECLIENT_CONFIG_ROOT"
          --target "${{ matrix.target }}"
          --allow-missing-build "${{ matrix.allow_missing_build }}"
